<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="header">
        <h1>Where in the world?</h1>
        <p>Dark Mode</p>
    </header>

    <main>

        <div>
            <input class="input" type="search" placeholder="Search for a country…">
        </div>

        <div class="countries-grid">

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/flagofgermany.png" alt="Germany" class="flag-img">
                </div>
                <div class="country-name">Germany</div>
            </div>

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/usa.png" alt="USA" class="flag-img">
                </div>
                <div class="country-name">USA</div>
            </div>

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/brazil.png" alt="Brazil" class="flag-img">
                </div>
                <div class="country-name">Brazil</div>
            </div>

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/iceland.png" alt="Iceland" class="flag-img">
                </div>
                <div class="country-name">Iceland</div>
            </div>

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/afganistan.png" alt="Afghanistan" class="flag-img">
                </div>
                <div class="country-name">Afghanistan</div>
            </div>

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/Alandislands.png" alt="Åland Islands" class="flag-img">
                </div>
                <div class="country-name">Åland Islands</div>
            </div>

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/albania.png" alt="Albania" class="flag-img">
                </div>
                <div class="country-name">Albania</div>
            </div>

            <div class="country-card">
                <div class="flag-container">
                    <img src="images/algeria.png" alt="Algeria" class="flag-img">
                </div>
                <div class="country-name">Algeria</div>
            </div>

        </div>

    </main>

</body>

</html>
